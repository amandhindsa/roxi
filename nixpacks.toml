[phases.setup]
nixPkgs = ["python311", "chromium", "nss", "nspr", "atk", "cups", "libdrm", "dbus", "libXcomposite", "libXdamage", "libXrandr", "libgbm", "libxkbcommon", "pango", "cairo", "alsa-lib"]

[phases.install]
cmds = [
  "pip install -e '.[supabase]'",
  "playwright install chromium"
]

[start]
cmd = "uvicorn roxi.api.app:app --host 0.0.0.0 --port $PORT"
